[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hassy-normalizer"
version = "0.1.0"
description = "Hassaniya Arabic text normalizer with variant handling and letter rules"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hassaniya Normalizer Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.9"
dependencies = [
    "rich>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
hassy-normalize = "hassy_normalizer.cli:main"
hassy-normalize-ui = "hassy_normalizer.web_ui.server:main"

[project.urls]
Homepage = "https://github.com/Amin-tech99/hassaniya-normaliser"
Repository = "https://github.com/Amin-tech99/hassaniya-normaliser"
Issues = "https://github.com/Amin-tech99/hassaniya-normaliser/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["hassy_normalizer", "hassy_normalizer.web_ui"]
include-package-data = true

[tool.setuptools.package-data]
"hassy_normalizer" = ["data/*.json", "data/*.jsonl"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = ["E501", "S101"]
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", ".pytest_cache", "build", "dist", "tmp", ".test_tmp", "corpora"]
addopts = "-p no:cacheprovider"
